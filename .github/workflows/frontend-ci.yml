name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
  jobs:
    build-and-lint:
      runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: Frontend
      
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: npm
            cache-depedency-path: frontend/package-lock.json

        - name: Install dependencies
          run: npm CI

        - name: Run ESLint
          run: npm run lint

        - name: Build frontend
          run: npm run build